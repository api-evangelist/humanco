description: HumanCo is a mission-driven consumer packaged goods and wellness holding company that builds and
  acquires better-for-you food, beverage, and lifestyle brands made with real, clean ingredients and free of
  seed oils and highly processed inputs. Its portfolio spans brands and concepts such as Against the Grain
  (gluten-free foods), True Food Kitchen (health-focused restaurants), and Grove Collaborative (sustainable
  home and personal care). Surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. HumanCo operates a marketing and e-commerce web presence but publishes no public developer API,
  SDKs, or technical developer platform at this time.
